name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaynab_book_flutter_app.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract project
        run: |
          rm -rf app
          mkdir app
          unzip -q zaynab_book_flutter_app.zip -d app
          PROJECT_DIR=$(dirname "$(find app -name pubspec.yaml -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Create Android files
        run: |
          cd "$PROJECT_DIR"
          rm -rf android
          flutter create . --platforms=android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zaynab-book-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
